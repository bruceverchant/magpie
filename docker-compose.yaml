services:
  magpie:
    image: ghcr.io/yetone/magpie:latest
    container_name: magpie
    restart: unless-stopped

    ports:
      - "3425:3425"
      - "3430:3430"

    environment:
      MAGPIE_ADDR: "0.0.0.0:3425"
      MAGPIE_WEB_KEY: "${MAGPIE_WEB_KEY:?Set MAGPIE_WEB_KEY}"

    volumes:
      - magpie_config:/config

    command: ["web", "--addr", "0.0.0.0:3430", "--no-open"]

volumes:
  magpie_config: {}
