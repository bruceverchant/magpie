name: magpie

services:
  magpie:
    image: ghcr.io/yetone/magpie:latest
    container_name: magpie
    restart: unless-stopped

    ports:
      - "${MAGPIE_GATEWAY_BIND_IP:-127.0.0.1}:3425:3425"
      - "127.0.0.1:3430:3430"

    environment:
      MAGPIE_PUBLIC_URL: "${MAGPIE_PUBLIC_URL:-http://127.0.0.1:3425}"
      MAGPIE_WEB_KEY: "${MAGPIE_WEB_KEY:?Set MAGPIE_WEB_KEY in .env}"

    volumes:
      - magpie_config:/config

    command: ["web", "--addr", "0.0.0.0:3430", "--no-open"]

volumes:
  magpie_config: {}
